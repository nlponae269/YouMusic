# Локальный запуск: docker compose up --build  →  http://localhost:8080
services:
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://youmusic:youmusic@db:5432/youmusic
      PGSSLROOTCERT: ""
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET: music
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
    depends_on:
      db: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: youmusic
      POSTGRES_PASSWORD: youmusic
      POSTGRES_DB: youmusic
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "youmusic"]
      interval: 2s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [s3data:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
             mc mb --ignore-existing local/music"

volumes:
  pgdata:
  s3data:
