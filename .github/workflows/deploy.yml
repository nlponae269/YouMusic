# Публикует сайт на GitHub Pages. Адрес и ключ Supabase берутся из секретов репозитория
# (Settings → Secrets and variables → Actions): SUPABASE_URL и SUPABASE_ANON_KEY.
# Если секрет не найден, пробуются одноимённые переменные (Variables).
name: Deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Подключение к Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Не заданы SUPABASE_URL и SUPABASE_ANON_KEY — сайт опубликуется без базы"
          fi
          node -e 'const e = process.env; require("fs").writeFileSync("public/config.js",
            `window.SUP_CFG = ${JSON.stringify({ url: e.SUPABASE_URL || "", key: e.SUPABASE_ANON_KEY || "" })};\n`)'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
