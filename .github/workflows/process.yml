# Каждые 10 минут (по расписанию): генерация песен (ACE-Step) и модерация загрузок (Demucs + Whisper).
# На месте мата, наркотиков и суицида остаётся бит, после чего трек публикуется.
# Нужны переменная SUPABASE_URL и секрет SUPABASE_SERVICE_KEY.
name: Process uploads

on:
  schedule:
    # не «круглые» минуты: в начале часа GitHub перегружен и задерживает запуски
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

concurrency:
  group: process-uploads
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  ACE_STEP_COMMIT: ca1e85fe9430179831e6bc6be790c332190a3866

jobs:
  check:
    name: Проверка очереди
    runs-on: ubuntu-latest
    outputs:
      work: ${{ steps.queue.outputs.work }}
      gen: ${{ steps.queue.outputs.gen }}
    steps:
      - uses: actions/checkout@v4

      - name: Администраторы (по почте владельца)
        run: python3 processor/admins.py

      - name: Есть ли что делать
        id: queue
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::warning::Не заданы SUPABASE_URL (переменная) и SUPABASE_SERVICE_KEY (секрет)"
            echo "work=false" >> "$GITHUB_OUTPUT"; echo "gen=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          q() { curl -sf "$SUPABASE_URL/rest/v1/$1" -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY"; }
          gen=$(q "tracks?select=id&status=eq.pending&source_path=like.*.gen&limit=1")
          queue=$(q "tracks?select=id&status=in.(pending,processing)&source_path=not.like.*.gen&limit=1")
          lyrics=$(q "tracks?select=id&status=eq.ready&has_lyrics=eq.false&error=is.null&limit=1")
          failed=$(q "tracks?select=id&status=eq.failed&created_at=lt.$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)&limit=1")
          recheck=$(python3 processor/needs_recensor.py)
          [ "$gen" = "[]" ] && echo "gen=false" >> "$GITHUB_OUTPUT" || echo "gen=true" >> "$GITHUB_OUTPUT"
          if [ "$queue$lyrics$failed" = "[][][]" ] && [ "$recheck" = "no" ]; then
            echo "work=false" >> "$GITHUB_OUTPUT"
          else
            echo "work=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Генерация: $gen | очередь: $queue | без текста: $lyrics | перепроверка: $recheck"

  generate:
    name: Генерация песен (ACE-Step)
    needs: check
    if: needs.check.outputs.gen == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: processor/requirements-gen.txt

      - name: Код ACE-Step
        run: |
          git clone -q https://github.com/ace-step/ACE-Step-1.5.git ace-step
          git -C ace-step checkout -q "$ACE_STEP_COMMIT"

      - name: Кэш модели ACE-Step
        uses: actions/cache@v4
        with:
          path: ace-step/checkpoints
          key: ace-step-v15-turbo-${{ env.ACE_STEP_COMMIT }}

      - name: Установка
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r processor/requirements-gen.txt

      - name: Генерация
        env:
          ACE_REPO: ace-step
        run: python processor/generate.py

  process:
    name: Модерация
    needs: [check, generate]
    if: always() && (needs.check.outputs.work == 'true' || needs.check.outputs.gen == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: processor/requirements.txt

      - name: Кэш моделей нейросетей
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: models-htdemucs-whisper-medium

      - name: Установка
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r processor/requirements.txt

      - name: Обработка очереди
        run: python processor/process.py
