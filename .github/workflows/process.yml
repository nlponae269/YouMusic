# Модерация загрузок: каждые 10 минут проверяет очередь в Supabase.
# Нейросети Demucs + Whisper вырезают мат и упоминания наркотиков (на их месте остаётся бит),
# после чего трек публикуется. Нужен секрет SUPABASE_SERVICE_KEY и переменная SUPABASE_URL.
name: Process uploads

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: process-uploads
  cancel-in-progress: false

jobs:
  process:
    name: Модерация
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: Есть ли что обрабатывать
        id: queue
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::warning::Не заданы SUPABASE_URL (переменная) и SUPABASE_SERVICE_KEY (секрет)"
            echo "work=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          body=$(curl -sf "$SUPABASE_URL/rest/v1/tracks?select=id&status=in.(pending,processing)&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY")
          if [ "$body" = "[]" ]; then echo "Очередь пуста"; echo "work=false" >> "$GITHUB_OUTPUT"
          else echo "work=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.queue.outputs.work == 'true'

      - uses: actions/setup-python@v5
        if: steps.queue.outputs.work == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: processor/requirements.txt

      - name: Кэш моделей нейросетей
        if: steps.queue.outputs.work == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: models-htdemucs-whisper-medium

      - name: Установка
        if: steps.queue.outputs.work == 'true'
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r processor/requirements.txt

      - name: Обработка очереди
        if: steps.queue.outputs.work == 'true'
        run: python processor/process.py
